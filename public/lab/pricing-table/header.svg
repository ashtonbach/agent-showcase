<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2620"/>
      <stop offset="1" stop-color="#121A16"/>
    </linearGradient>
    <linearGradient id="tierShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa89a"/>
      <stop offset="1" stop-color="#B0CBBC"/>
    </linearGradient>
    <linearGradient id="creamFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EFE6"/>
      <stop offset="1" stop-color="#e5e0d4"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="160" fill="url(#sky)"/>
  <ellipse cx="360" cy="175" rx="420" ry="45" fill="#0d1411" opacity="0.5"/>
  <!-- tier 1 base -->
  <path d="M40 130 L200 130 L200 118 L40 118 Z" fill="#2a3d32"/>
  <path d="M40 118 L200 118 L200 105 L40 105 Z" fill="url(#tierShade)"/>
  <path d="M40 105 L200 105 L200 92 L40 92 Z" fill="#9bb5a6"/>
  <!-- tier 2 -->
  <path d="M130 115 L290 115 L290 100 L130 100 Z" fill="#243329"/>
  <path d="M130 100 L290 100 L290 82 L130 82 Z" fill="url(#tierShade)"/>
  <path d="M130 82 L290 82 L290 68 L130 68 Z" fill="#a8c4b4"/>
  <!-- tier 3 -->
  <path d="M220 98 L400 98 L400 78 L220 78 Z" fill="#1f2e26"/>
  <path d="M220 78 L400 78 L400 55 L220 55 Z" fill="url(#creamFace)"/>
  <path d="M220 55 L400 55 L400 42 L220 42 Z" fill="#B0CBBC"/>
  <!-- tier 4 -->
  <path d="M330 88 L520 88 L520 62 L330 62 Z" fill="#1a2620"/>
  <path d="M330 62 L520 62 L520 38 L330 38 Z" fill="url(#creamFace)"/>
  <path d="M330 38 L520 38 L520 24 L330 24 Z" fill="#c5d9cc"/>
  <!-- tier 5 top -->
  <path d="M450 75 L620 75 L620 48 L450 48 Z" fill="#151f1a"/>
  <path d="M450 48 L620 48 L620 22 L450 22 Z" fill="#F2EFE6"/>
  <path d="M450 22 L620 22 L620 12 L450 12 Z" fill="#D9B45A"/>
  <!-- accent gems on tiers -->
  <circle cx="120" cy="98" r="4" fill="#D9B45A" opacity="0.7"/>
  <circle cx="210" cy="72" r="3.5" fill="#D9B45A" opacity="0.55"/>
  <circle cx="360" cy="48" r="4" fill="#D9B45A" opacity="0.65"/>
  <circle cx="535" cy="35" r="5" fill="#D9B45A"/>
  <rect x="528" y="28" width="14" height="6" rx="1" fill="#e8c96e" opacity="0.9"/>
  <!-- connecting rise lines -->
  <path d="M200 105 Q260 90 290 100" fill="none" stroke="#B0CBBC" stroke-width="1" opacity="0.25"/>
  <path d="M290 82 Q350 65 400 78" fill="none" stroke="#B0CBBC" stroke-width="1" opacity="0.25"/>
  <path d="M400 55 Q460 40 520 62" fill="none" stroke="#F2EFE6" stroke-width="1" opacity="0.2"/>
  <!-- mist bands -->
  <path d="M0 125 Q180 115 360 120 T720 118 L720 160 L0 160 Z" fill="#B0CBBC" opacity="0.06"/>
  <path d="M0 140 Q200 132 400 138 T720 135 L720 160 L0 160 Z" fill="#F2EFE6" opacity="0.04"/>
  <!-- subtle stars -->
  <circle cx="80" cy="28" r="1.2" fill="#B0CBBC" opacity="0.4"/>
  <circle cx="650" cy="18" r="1" fill="#D9B45A" opacity="0.5"/>
  <circle cx="580" cy="55" r="0.8" fill="#B0CBBC" opacity="0.35"/>
  <circle cx="700" cy="42" r="1.1" fill="#B0CBBC" opacity="0.3"/>
</svg>
