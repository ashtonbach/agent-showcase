<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="720" height="160" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121A16"/>
      <stop offset="1" stop-color="#1A2620"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2EFE6" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#B0CBBC" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F2EFE6" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B0CBBC"/>
      <stop offset="1" stop-color="#7A9A88"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9B45A" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#D9B45A" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="720" height="160" fill="url(#sky)"/>
  <ellipse cx="120" cy="178" rx="220" ry="46" fill="#F2EFE6" opacity="0.06"/>
  <ellipse cx="420" cy="186" rx="280" ry="50" fill="#B0CBBC" opacity="0.08"/>
  <path d="M0 98 C80 88 140 108 210 96 C280 84 320 110 400 92 C500 70 560 100 720 78 L720 160 L0 160 Z" fill="#0E1512"/>
  <path d="M0 118 C90 110 160 128 250 116 C340 104 410 130 520 114 C600 104 660 122 720 108 L720 160 L0 160 Z" fill="#16201B"/>
  <g fill="url(#mist)">
    <ellipse cx="200" cy="72" rx="130" ry="16"/>
    <ellipse cx="480" cy="58" rx="150" ry="14"/>
    <ellipse cx="620" cy="44" rx="90" ry="10"/>
  </g>
  <!-- low terrace -->
  <g>
    <polygon points="48,132 168,132 156,108 60,108" fill="url(#stone)"/>
    <polygon points="60,108 156,108 150,100 66,100" fill="#C7D8CD"/>
    <rect x="72" y="114" width="72" height="6" rx="2" fill="#121A16" opacity="0.18"/>
    <rect x="84" y="122" width="48" height="4" rx="2" fill="#121A16" opacity="0.12"/>
  </g>
  <!-- mid terrace -->
  <g>
    <polygon points="248,118 400,118 386,88 262,88" fill="url(#stone)"/>
    <polygon points="262,88 386,88 378,78 270,78" fill="#D5E2D8"/>
    <rect x="284" y="96" width="80" height="6" rx="2" fill="#121A16" opacity="0.16"/>
    <rect x="298" y="104" width="52" height="4" rx="2" fill="#121A16" opacity="0.10"/>
    <circle cx="324" cy="68" r="7" fill="#D9B45A" opacity="0.85"/>
    <circle cx="324" cy="68" r="3" fill="#F2EFE6"/>
  </g>
  <!-- high terrace -->
  <g>
    <polygon points="468,96 668,96 650,56 486,56" fill="url(#stone)"/>
    <polygon points="486,56 650,56 640,44 496,44" fill="#E4EDE7"/>
    <rect x="516" y="66" width="100" height="6" rx="2" fill="#121A16" opacity="0.14"/>
    <rect x="534" y="76" width="64" height="4" rx="2" fill="#121A16" opacity="0.10"/>
    <path d="M568 28 L576 44 L560 44 Z" fill="#D9B45A"/>
    <rect x="566" y="44" width="12" height="12" fill="#D9B45A" opacity="0.7"/>
  </g>
  <!-- rising steps between terraces -->
  <g fill="#B0CBBC">
    <rect x="176" y="124" width="22" height="8" rx="1"/>
    <rect x="196" y="116" width="22" height="8" rx="1"/>
    <rect x="216" y="108" width="22" height="8" rx="1"/>
    <rect x="412" y="104" width="18" height="7" rx="1"/>
    <rect x="428" y="94" width="18" height="7" rx="1"/>
    <rect x="444" y="84" width="18" height="7" rx="1"/>
  </g>
  <rect x="0" y="0" width="720" height="160" fill="url(#ridge)" opacity="0.35"/>
  <line x1="40" y1="148" x2="680" y2="148" stroke="#D9B45A" stroke-width="1.5" opacity="0.35"/>
</svg>
